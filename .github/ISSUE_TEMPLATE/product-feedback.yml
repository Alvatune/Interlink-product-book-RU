name: Замечание или предложение
description: Сообщите о неточности, непонятном месте, риске или направлении развития.
title: "[Обратная связь] "
body:
  - type: markdown
    attributes:
      value: |
        Лучше всего помогает замечание, связанное с реальным пользовательским результатом. Не публикуйте конфиденциальные материалы и данные предприятия.
  - type: dropdown
    id: kind
    attributes:
      label: Вид обратной связи
      options:
        - Ошибка в описании сценария
        - Неучтённый обязательный сценарий
        - Непонятное объяснение или термин
        - Риск предложенного решения Interlink
        - Предложение по развитию
        - Предложение по испытаниям
    validations:
      required: true
  - type: textarea
    id: place
    attributes:
      label: Где находится проблема
      description: Укажите страницу и раздел либо кратко назовите тему.
  - type: textarea
    id: observation
    attributes:
      label: Что следует уточнить или изменить
      description: Опишите проблему своими словами и поясните, почему она существенна.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Машиностроительный пример
      description: По возможности приведите обезличенный случай с изделием, составом, документом, изменением или заказом.
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый пользовательский результат
      description: Что должен получить или увидеть специалист после исправления?
    validations:
      required: true
